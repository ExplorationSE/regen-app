<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><title>ExplorationSE Regen</title>
<link rel="preload" href="./fonts/explorationse-regen.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-v3-512.png"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-v3-192.png"><link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-v3-32.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="application-name" content="ExplorationSE Regen"><meta name="apple-mobile-web-app-title" content="ExplorationSE Regen">
<link rel="stylesheet" href="./vendor/maplibre-gl.css"><link rel="modulepreload" href="./vendor/maplibre-gl.mjs">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--pb:#003153;--pb2:#1f5f8b;--pb3:#3a82b5}
*{box-sizing:border-box}html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{padding:8px 14px 6px;display:flex;flex-direction:column;gap:2px}
.row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
#frameTime{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
#frameKind{font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
#frameKind.fc{color:#9cc3e4}
#here{font-size:14px;line-height:1.3;min-height:18px}
#here b{font-weight:600}
#state{font-size:12px;color:var(--mut);display:flex;align-items:center;min-height:16px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mut);flex:none}
.dot.live{background:var(--pb3);box-shadow:0 0 6px var(--pb3);animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}
.dot.warn{background:#d29922}
#mapwrap{flex:1 1 0;min-height:160px;position:relative;margin:0 6px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
#map{position:absolute;inset:0;background:#0b0e13}
#msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:800;background:rgba(13,17,23,.88);border:1px solid var(--line);color:var(--txt);font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;display:none}
#locBtn{position:absolute;right:10px;top:10px;z-index:800;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(22,27,34,.92);color:var(--txt);display:flex;align-items:center;justify-content:center;padding:0}
#locBtn svg{width:22px;height:22px}
.maplibregl-map{font-family:inherit}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib{background:rgba(13,17,23,.72);color:#6e7681;font-size:9px;line-height:1.3;padding:1px 5px;margin:0;border-top-left-radius:6px}
.maplibregl-ctrl-attrib a{color:#8b949e}
.me{position:relative;width:0;height:0}.me i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#e8f1f8;border:3px solid var(--pb3);box-shadow:0 0 0 2px rgba(0,0,0,.6)}
.me i.pulse{width:40px;height:40px;margin:-20px 0 0 -20px;background:rgba(58,130,181,.35);border:0;box-shadow:none;animation:mp 2.2s ease-out infinite}@keyframes mp{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
.tl{position:relative;margin:4px 6px 0;padding-bottom:16px} /* Zeitleiste: eigene Zeile, volle Breite wie die Karte */
#slider{display:block;width:100%;margin:0;height:44px;background:transparent;-webkit-appearance:none;appearance:none;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#slider:focus{outline:none}
#slider::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--trk,#30363d)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-9px;border-radius:50%;background:#e8f1f8;border:4px solid var(--pb3);box-shadow:0 1px 6px rgba(0,0,0,.6)}
#slider:active::-webkit-slider-thumb{transform:scale(1.1)}
#slider::-moz-range-track{height:12px;border-radius:6px;background:var(--trk,#30363d)}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#e8f1f8;border:4px solid var(--pb3)}
.ticks{position:absolute;left:15px;right:15px;bottom:0;height:15px;font-size:12px;color:var(--mut);pointer-events:none} /* 15px = halbe Reglerbreite, damit die Marken unter der Reglermitte stehen */
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span.now{color:var(--txt);font-weight:600}
.ctl{display:flex;align-items:center;gap:10px;padding:6px 8px 0}
#play{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--pb2);background:var(--pb);color:#e8f1f8;display:flex;align-items:center;justify-content:center;padding:0}
#play svg{width:20px;height:20px}
#nowBtn{flex:none;background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:10px;font-size:13px;font-weight:600;padding:0 10px;min-height:38px}
.legend{flex:1;min-width:0;font-size:10px;color:var(--mut)}
.lbar{display:flex;height:8px;border-radius:4px;overflow:hidden}
.lbar i{flex:1}
.llab{position:relative;height:13px;margin-top:2px}
.llab span{position:absolute;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.llab span:first-child{transform:none}.llab span.end{transform:translateX(-100%)}
@font-face{font-family:'ExplorationSE Regen';src:url(./fonts/explorationse-regen.woff2) format('woff2');font-display:swap} /* Teilmenge von Marcellus (SIL OFL 1.1), nur Zeichen „ExplorationSE Regen“ */
footer{font-size:10px;color:#6e7681;text-align:center;padding:4px 10px 6px;line-height:1.3}
footer span{white-space:nowrap}
footer a{color:inherit;text-decoration:none}
footer .brand{font-family:'ExplorationSE Regen',serif;font-size:12px;color:#8b949e;letter-spacing:.3px}
</style></head><body>
<div class="top">
  <div class="row1"><span id="frameTime">–</span><span id="frameKind"></span></div>
  <div id="here">Standort wird ermittelt …</div>
  <div id="state"><span class="dot" id="dot"></span><span id="stateTxt">Lade Radardaten …</span></div>
</div>
<div id="mapwrap"><div id="map"></div><div id="msg"></div>
  <button id="locBtn" title="Auf meinen Standort zentrieren" aria-label="Auf meinen Standort zentrieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>
<div class="tl"><input type="range" id="slider" min="0" max="0" value="0" aria-label="Zeitpunkt"><div class="ticks" id="ticks"></div></div>
<div class="ctl">
  <button id="play" title="Abspielen" aria-label="Abspielen"></button>
  <div class="legend" id="legend"></div>
  <button id="nowBtn" title="Zum aktuellen Radarbild">Jetzt</button>
</div>
<footer><span title="ExplorationSE Regen – © Stefan Eilers, MIT-Lizenz"><span class="brand">SE Regen</span> © Stefan Eilers</span> · <span id="src">Quelle: <a href="https://www.dwd.de" target="_blank" rel="noopener">Deutscher Wetterdienst</a></span> · <span title="Version 0.3.2">v0.3.2</span></footer>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'});</script>
</body></html>
